<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Practice 11. Order Shawarma</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
	<header>
		<h1>Shawarma Order Placement</h1>
	</header>
	<content>
		<form method="POST" th:action="@{/orders}" th:object="${shawarmaOrder}">
			<h3>You've chosen:</h3>
			<a th:href="@{/design}" id="another">Add another one</a><br/>
			<ul>
				<li th:each="shawarma : ${shawarmaOrder.shawarmas}">
					<span th:text="${shawarma.name}">shawarma name</span>
				</li>
			</ul>
			<h3>Fill in delivery information</h3>
			<label for="deliveryName">Name: </label>
			<input type="text" th:field=*{deliveryName}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('deliveryName')}" 
				th:errors="*{deliveryName}">Delivery name error</span><br/>
			<label for="deliveryStreet">Street address: </label>
			<input type="text" th:field=*{deliveryStreet}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('deliveryStreet')}" 
				th:errors="*{deliveryStreet}">Delivery street error</span><br/>
			<label for="deliveryCity">City: </label>
			<input type="text" th:field=*{deliveryCity}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('deliveryCity')}" 
				th:errors="*{deliveryCity}">Delivery city error</span><br/>
			<label for="deliveryState">State: </label>
			<input type="text" th:field=*{deliveryState}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('deliveryState')}" 
				th:errors="*{deliveryState}">Delivery state error</span><br/>
			<label for="deliveryZipCode">Zip Code: </label>
			<input type="text" th:field=*{deliveryZipCode}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('deliveryZipCode')}" 
				th:errors="*{deliveryZipCode}">Delivery zip error</span><br/>
			<h3>Fill in payment information</h3>
			<label for="ccNumber">Credit Card #: </label>
			<input type="text" th:field=*{ccNumber}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ccNumber')}" 
				th:errors="*{ccNumber}">CC Number error</span><br/>
			<label for="ccExpiration">Expiration: </label>
			<input type="text" th:field=*{ccExpiration}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ccExpiration')}" 
				th:errors="*{ccExpiration}">CC Expiration error</span><br/>
			<label for="ccCVV">CVV: </label>
			<input type="text" th:field=*{ccCVV}>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ccCVV')}" 
				th:errors="*{ccCVV}">CC CVV error</span><br/><br/>
			<input type="submit" value="Place Order">
		</form>
	</content>
</body>
</html>
