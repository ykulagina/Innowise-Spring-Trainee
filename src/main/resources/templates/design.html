<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Practice 11. Design Shawarma</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
	<h1>Shawarma Design</h1>
	<h1>Keep it simple</h1>
	<img th:src="@{/images/shawarma.jpeg}" />
	<form method="POST" th:object="${shawarma}">
		<div class="ingredient-group" id="wraps">
		<h3>Wrap selector</h3>
		<div th:each="ingredient : ${wrap}">
			<input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
			<span th:text="${ingredient.name}">INGREDIENT</span><br/>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ingredients')}" 
				th:errors="*{ingredients}">Ingredient error</span><br/>
		</div>
		</div>
		<div class="ingredient-group" id="proteins">
		<h3>Protein selector</h3>
		<div th:each="ingredient : ${protein}">
			<input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
			<span th:text="${ingredient.name}">INGREDIENT</span><br/>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ingredients')}" 
				th:errors="*{ingredients}">Ingredient error</span><br/>
		</div>
		</div>
		<div class="ingredient-group" id="veggies">
		<h3>Veggies selector</h3>
		<div th:each="ingredient : ${veggies}">
			<input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
			<span th:text="${ingredient.name}">INGREDIENT</span><br/>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ingredients')}" 
				th:errors="*{ingredients}">Ingredient error</span><br/>
		</div>
		</div>
		<div class="ingredient-group" id="cheeses">
		<h3>Cheese selector</h3>
		<div th:each="ingredient : ${cheese}">
			<input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
			<span th:text="${ingredient.name}">INGREDIENT</span><br/>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ingredients')}" 
				th:errors="*{ingredients}">Ingredient error</span><br/>
		</div>
		</div>
		<div class="ingredient-group" id="sauces">
		<h3>Sauce selector</h3>
		<div th:each="ingredient : ${sauce}">
			<input th:field="*{ingredients}" type="checkbox" th:value="${ingredient.id}"/>
			<span th:text="${ingredient.name}">INGREDIENT</span><br/>
			<span class="validationError" 
				th:if="${#fields.hasErrors('ingredients')}" 
				th:errors="*{ingredients}">Ingredient error</span><br/>
		</div>
		</div>
		<label for="shawarma-name">Name it:</label>
		<input type="text" name="shawarma-name" th:field="*{name}"/>
		<span class="validationError" 
				th:if="${#fields.hasErrors('name')}" 
				th:errors="*{name}">Name error</span><br/><br/>
		<input type="submit" value="Create">
	</form>
</body>
</html>
