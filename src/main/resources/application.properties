spring.application.name=spring-practice10
spring.devtools.add-properties=true
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:postgresql://localhost:5432/trainee
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#ddl-auto could be set to 'update', if automatic update of schemas is required. never used in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect